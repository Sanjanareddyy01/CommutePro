<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CommutePro: rider and admin working model</title>
<style>
:root{--bg:#eef0f5;--card:#fff;--ink:#14161f;--mut:#5b6070;--bd:#d3d6e0;--sel:#2b2f3e;--selink:#fff;--soft:#f1f2f6;--ok:#17734a;--okbg:#e6f5ec;--warn:#8a5200;--warnbg:#fdf1d6;--bad:#b42323;--badbg:#fde4e4;--pur:#3a2fa8;--purbg:#ecebfa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1118;--card:#1b1e2b;--ink:#f1f2f6;--mut:#a7acbc;--bd:#3a3f52;--sel:#f1f2f6;--selink:#14161f;--soft:#262a3a;--ok:#7fe0aa;--okbg:#17342a;--warn:#f0c36a;--warnbg:#3a2f12;--bad:#ff9a9a;--badbg:#3d1c1c;--pur:#b9b3ff;--purbg:#2a2750}}
:root[data-theme="dark"]{--bg:#0f1118;--card:#1b1e2b;--ink:#f1f2f6;--mut:#a7acbc;--bd:#3a3f52;--sel:#f1f2f6;--selink:#14161f;--soft:#262a3a;--ok:#7fe0aa;--okbg:#17342a;--warn:#f0c36a;--warnbg:#3a2f12;--bad:#ff9a9a;--badbg:#3d1c1c;--pur:#b9b3ff;--purbg:#2a2750}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.bar b{font-size:16px}.tab{font:inherit;font-weight:700;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--sel);color:var(--selink);border-color:var(--sel)}.sp{flex:1}.live{font-size:12px;color:var(--mut)}
.wrap{padding:18px 12px;display:flex;justify-content:center}
.ph{width:100%;max-width:420px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.top{background:#23262f;color:#fff;padding:14px 20px 10px}.top b{letter-spacing:2px}.top span{margin-left:6px;font-size:12px;opacity:.85}
.road{height:26px;margin:10px 0 6px;border-radius:6px;background:#3a3d48;position:relative}.road:before{content:"";position:absolute;left:8px;right:8px;top:11px;border-top:3px dashed #fff}
.st{font-size:10px;letter-spacing:2px;opacity:.8}.bd{padding:18px 20px 22px}
h1{font-size:25px;margin:6px 0 6px}h2{font-size:17px;margin:0 0 6px}.bot{background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:700;margin-bottom:12px}
.lab{font-weight:700;margin:14px 0 7px;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--bd);border-radius:999px;padding:10px 15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--sel);color:var(--selink);border-color:var(--sel)}.chip.d{border-style:dashed;color:var(--mut)}
input{font:inherit;font-size:16px;width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=range]{padding:0;border:0;accent-color:var(--sel)}
.go{margin-top:16px;width:100%;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:999px;padding:16px;background:#2b2f3e;color:#fff;cursor:pointer}
.go.alt{background:var(--soft);color:var(--ink);margin:0 0 10px}.pn{margin-top:10px;border:1.5px solid var(--bd);border-radius:14px;padding:4px 12px 12px;background:var(--soft)}
.msg{margin-top:12px;border-radius:12px;padding:11px 13px;font-weight:700}.m-ok{background:var(--okbg);color:var(--ok)}.m-w{background:var(--warnbg);color:var(--warn)}.m-b{background:var(--badbg);color:var(--bad)}.m-p{background:var(--purbg);color:var(--pur)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.mapsvg{width:100%;display:block;touch-action:none;cursor:crosshair;border:1.5px solid var(--bd);border-radius:12px}.pi{margin:8px 0;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.opt{font:inherit;text-align:left;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed=true]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}.big{font-size:22px;font-weight:800}
.adm{max-width:1250px;margin:0 auto;padding:16px}.adm h1{color:var(--warn)}.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:10px 0 18px}
table{border-collapse:collapse;width:100%;min-width:900px}th{font:10px monospace;letter-spacing:1.2px;color:var(--mut);text-align:left;background:var(--soft);padding:9px 10px}
td{padding:10px;border-top:1px solid var(--bd);vertical-align:top}td small,.stat small{display:block;color:var(--mut)}.nm{font-weight:700;color:var(--warn)}
.pl{display:inline-block;border-radius:12px;padding:3px 9px;font-size:12px;font-weight:700;margin:1px 2px 1px 0}.g{background:var(--okbg);color:var(--ok)}.y{background:var(--warnbg);color:var(--warn)}.r{background:var(--badbg);color:var(--bad)}.n{background:var(--soft);color:var(--mut)}.p{background:var(--purbg);color:var(--pur)}
.ab{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:7px;padding:6px 9px;cursor:pointer;margin:2px 4px 2px 0}.ab.pr{background:#a96a00;color:#fff;border-color:#a96a00}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}.stat{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--card)}.stat b{font-size:22px;display:block}
.pc{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--card);margin-bottom:12px}tr.bad td{background:var(--badbg)}tr.wl td{background:var(--purbg)}
:focus-visible{outline:3px solid #3b6fd4;outline-offset:2px}
</style></head><body>
<div class="bar"><b>CommutePro</b><button class="tab" data-a="view" data-v="rider" aria-pressed="true">Rider panel</button><button class="tab" data-a="view" data-v="admin" aria-pressed="false">Admin panel</button><span class="sp"></span><span class="live" id="live">Local only</span><button class="ab" data-a="newr">New rider</button><button class="ab" data-a="reset">Reset all data</button></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PRICE={3:290,4:240},SEATS=["Front","Back left","Back middle","Back right"],DAYS=["M","T","W","T","F"],REACH=["8:30 AM","9:00 AM","9:30 AM","10:00 AM"],LEAVE=["5:30 PM","6:00 PM","6:30 PM","7:00 PM"];
const AR=[{n:"Uppal",la:17.4058,lo:78.5591,ok:1},{n:"Habsiguda",la:17.405,lo:78.534,ok:1},{n:"ECIL",la:17.47,lo:78.57,ok:1},{n:"Kukatpally",la:17.4948,lo:78.3996,ok:1},{n:"Hitech City",la:17.4435,lo:78.3772,ok:1},{n:"Gachibowli",la:17.4401,lo:78.3489,ok:1},{n:"Kondapur",la:17.46,lo:78.364,ok:1},{n:"Kokapet",la:17.393,lo:78.327,ok:0},{n:"Narsingi",la:17.386,lo:78.358,ok:0},{n:"Shamshabad",la:17.254,lo:78.429,ok:0}];
const BANDS=[{k:"em",n:"Early morning",a:120,b:480},{k:"af",n:"Afternoon",a:720,b:1020},{k:"mn",n:"Midnight",a:1170,b:1440}];
let db=null,riders={},refs={},view="rider",at="reg",rf="all",me=null,draft=nd(),dragging=false,tm={};
try{me=localStorage.getItem("cp_me")}catch(e){}
function nd(){return{step:1,name:"",phone:"",refBy:"",refId:"",pu:null,of:null,mt:{pu:"map",of:"map"},lk:"",q:"",pickup:"",office:"",wl:"",reach:"9:00 AM",leave:"6:30 PM",oth:false,bd:{em:{t:300,d:[]},af:{t:780,d:[]},mn:{t:1260,d:[]}},days:[0,1,2,3,4],ride:"both",seater:4,err:"",utr:"",seat:"",go9:false}}
const now=()=>new Date().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const fm=m=>{const h=Math.floor(m/60)%24,mi=m%60;return (h%12||12)+":"+(mi?"30":"00")+" "+(h<12?"AM":"PM")};
const dn=a=>a.map(i=>DAYS[i]).join(" "),px=lo=>(lo-78.30)/0.30*300,py=la=>(17.52-la)/0.30*300;
function near(la,lo){let b=null,bd=9;AR.forEach(a=>{const x=Math.hypot(a.la-la,a.lo-lo);if(x<bd){bd=x;b=a}});return bd<0.04?b:{n:"Other location",ok:0,la:la,lo:lo}}
function info(w){const p=draft[w];if(!p)return"Tap the map to drop your pin.";const a=near(p.la,p.lo);return a.n+" · "+(a.ok?"we serve this area":"we do not serve this yet")+" · "+p.la+", "+p.lo}
function save(r){riders[r.id]=r;render();if(db){try{db.collection("riders").doc(r.id).set(r).catch(()=>{})}catch(e){}}}
function saveRef(id,name,by){refs[id]={name:name,by:by};if(db){try{db.collection("refs").doc(id).set(refs[id]).catch(()=>{})}catch(e){}}}
const chip=(l,on,a,v,k)=>`<button class="chip" aria-pressed="${!!on}" data-a="${a}" data-v="${esc(v)}"${k?` data-k="${k}"`:""}>${esc(l)}</button>`;
const dchips=(sel,a,k)=>`<div class="chips">${DAYS.map((d,i)=>chip(d,sel.includes(i),a,i,k)).join("")}</div>`;
const shell=(inner,step,bot)=>`<div class="wrap"><div class="ph"><div class="top"><b>POOL</b><span>by CommutePro</span><div class="road"></div><div class="st">${step}</div></div><div class="bd">${bot?`<div class="bot">${bot}</div>`:""}${inner}</div></div></div>`;
const PINSHAPE='<path d="M0 0C-9-11-9-20 0-20S9-11 0 0z" fill="#d64545"/><circle cy="-12" r="3" fill="#fff"/>';
function mapSvg(w){const p=draft[w];return`<svg class="mapsvg" data-w="${w}" viewBox="0 0 300 300" role="img" aria-label="Map. Tap to place the pin."><rect width="300" height="300" rx="10" fill="var(--soft)"/><path d="M0 230Q150 150 300 200" stroke="var(--bd)" stroke-width="7" fill="none"/>${AR.map(a=>`<circle cx="${px(a.lo)}" cy="${py(a.la)}" r="4" fill="${a.ok?"#2e9e6b":"#d64545"}"/><text x="${px(a.lo)}" y="${py(a.la)+13}" font-size="9" text-anchor="middle" fill="var(--mut)">${a.n}</text>`).join("")}<g id="pinG"${p?` transform="translate(${px(p.lo)},${py(p.la)})"`:""}>${p?PINSHAPE:""}</g></svg>`}
const qlist=()=>AR.filter(a=>a.n.toLowerCase().includes(draft.q.toLowerCase())).map(a=>chip(a.n,false,"area",a.n)).join("")||'<span class="live">Nothing found.</span>';
function mapStep(w){const d=draft,t=d.mt[w],pu=w=="pu";let body;
 if(t=="map")body=`<button class="go alt" data-a="live">Use my live location</button>${mapSvg(w)}<div class="pi" id="pi">${esc(info(w))}</div><div class="live">Prototype map. The real panel opens Google Maps here and returns the same pin.</div>`;
 else if(t=="link")body=`<div class="lab">Paste a Google Maps link</div><input data-f="lk" value="${esc(d.lk)}" placeholder="https://www.google.com/maps/@17.44,78.37,17z" autocomplete="off"><button class="go alt" style="margin-top:10px" data-a="uselink">Use this link</button>`;
 else body=`<input data-f="q" placeholder="Search an area" value="${esc(d.q)}" autocomplete="off"><div class="chips" id="ql" style="margin-top:10px">${qlist()}</div>`;
 return shell(`<h1>${pu?"Where do we pick you up?":"Where do we drop you?"}</h1><p class="live">${pu?"Your home, where the cab picks you up in the morning.":"Your office, where the cab drops you in the morning."}</p><div class="chips" style="margin:10px 0">${[["map","My location"],["link","Maps link"],["search","Search"]].map(x=>chip(x[1],t==x[0],"mt",x[0])).join("")}</div>${body}${d.err?`<div class="msg m-b">${esc(d.err)}</div>`:""}<button class="go" data-a="${pu?"n2":"n3"}">${pu?"Confirm pickup":"Confirm drop"}</button>`,`STEP ${pu?2:3} OF 5`,pu?"Oh, a new face. Tell me where you start.":"And where do we drop you?")}
function other(r){return BANDS.filter(b=>r.bd[b.k].d.length).map(b=>`${b.n} ${fm(r.bd[b.k].t)} on ${dn(r.bd[b.k].d)}`).join(" · ")}
function timeStep(){const d=draft,any=BANDS.some(b=>d.bd[b.k].d.length);
 return shell(`<h1>When do you travel?</h1><div class="lab">Reach office by</div><div class="chips">${REACH.map(t=>chip(t,t==d.reach,"reach",t)).join("")}</div><div class="lab">Leave office at</div><div class="chips">${LEAVE.map(t=>chip(t,t==d.leave,"leave",t)).join("")}</div><div style="margin-top:12px"><button class="chip d" data-a="oth" aria-expanded="${d.oth}">${d.oth?"− ":"+ "}Other timings</button></div>${d.oth?BANDS.map(b=>{const x=d.bd[b.k];return`<div class="pn"><div class="lab">${b.n} (${fm(b.a)} to ${fm(b.b)}): <span id="lt${b.k}">${fm(x.t)}</span></div><input type="range" data-f="bt" data-k="${b.k}" min="${b.a}" max="${b.b}" step="30" value="${x.t}" aria-label="${b.n} time"><div class="lab">${b.n} days</div>${dchips(x.d,"bday",b.k)}</div>`}).join(""):""}${d.oth&&any?'<div class="msg m-ok" role="status">Got it. We will also look for riders on these other timings.</div>':""}<div class="lab">Days</div>${dchips(d.days,"day")}${d.err?`<div class="msg m-b">${esc(d.err)}</div>`:""}<button class="go" data-a="n4">Continue</button>`,"STEP 4 OF 5")}
function priceStep(){const d=draft,P=PRICE[d.seater],legs=d.ride=="both"?2:1,n=d.days.length;
 return shell(`<h1>Choose your ride</h1><div class="chips">${[["both","Both ways"],["am","Morning only"],["pm","Evening only"]].map(x=>chip(x[1],d.ride==x[0],"ride",x[0])).join("")}</div><div class="two">${[3,4].map(s=>`<button class="opt" aria-pressed="${d.seater==s}" data-a="seater" data-v="${s}"><b>${s} seater</b><small>${s==3?"Window seat, every day":"Best price"}</small><span class="big">₹${PRICE[s]} <small>/ ride</small></span>${s==4?`<span><span class="pl g">1 seat left after you</span><span class="pl g">Save ₹${PRICE[3]-PRICE[4]} a ride</span></span>`:""}</button>`).join("")}</div><div class="pn" style="background:var(--card)">${d.ride!="pm"?`<div class="kv"><span>Login · ${esc(d.pickup)} to ${esc(d.office)} · ${d.reach}<small class="live">${n} rides × ₹${P}</small></span><b>₹${n*P}</b></div>`:""}${d.ride!="am"?`<div class="kv"><span>Logout · ${esc(d.office)} to ${esc(d.pickup)} · ${d.leave}<small class="live">${n} rides × ₹${P}</small></span><b>₹${n*P}</b></div>`:""}<div class="kv" style="border:0"><span><b>Your week</b><small class="live">${legs==2?"two cabs, two seats":"one cab, one seat"}</small></span><b style="font-size:22px">₹${legs*n*P}</b></div></div><button class="go" data-a="join">Join the pool · ₹${legs*n*P}/week</button>`,"STEP 5 OF 5","The 4 seater needs one more after you. The 3 seater needs two. Either way I will get you moving.")}
function rider(){const r=riders[me],d=draft,e=d.err?`<div class="msg m-b">${esc(d.err)}</div>`:"";
 if(!r){
  if(d.step==1)return shell(`<h1>A seat to work, every day</h1><div class="lab">Your name</div><input data-f="name" value="${esc(d.name)}" autocomplete="off"><div class="lab">WhatsApp number</div><input data-f="phone" inputmode="numeric" value="${esc(d.phone)}"><div class="lab">Friend’s referral ID (optional)</div><input data-f="refBy" placeholder="e.g. ABHI4821" value="${esc(d.refBy)}" autocomplete="off">${e}<button class="go" data-a="n1">Continue</button>`,"STEP 1 OF 5");
  if(d.step=="ref")return shell(`<h2>Your referral ID</h2><div class="msg m-p" style="font-size:26px;letter-spacing:3px;text-align:center">${esc(d.refId)}</div>${d.refBy?`<p>Referred by ${esc((refs[d.refBy]||{}).name)}. We will try to put you in the same cab.</p>`:""}<p>Give this ID to a friend to refer them or to pool with them. They enter it at step 1.</p><button class="go alt" data-a="copy">Copy ID</button><button class="go" style="margin-top:0" data-a="nref">Continue</button>`,"STEP 1 OF 5","Done. You are in.");
  if(d.step==2)return mapStep("pu");if(d.step==3)return mapStep("of");if(d.step==4)return timeStep();if(d.step==5)return priceStep();
  if(d.step=="wl")return shell(`<h2>We do not serve ${esc(d.wl)} yet</h2><p>You are on the waitlist and we will tell you when we start there. How many days a week would you travel?</p>${dchips(d.days,"day")}${e}<button class="go" data-a="wl">Join the waitlist</button>`,"WAITLIST","New location, no tension.");
 }
 const tot=r.week;
 if(r.status=="waitlist")return shell(`<div class="msg m-p">You are on the waitlist for ${esc(r.nolocation)}. We will message you when we start serving it.</div><div class="kv"><span>Days requested</span><b>${r.days.length}</b></div>`,"WAITLIST");
 if(r.status=="filling")return shell(`<h2>Filling up</h2><p>${esc(r.pickup)} → ${esc(r.office)} · ${r.reach} / ${r.leave}</p>${r.other?`<div class="msg m-p">Also looking at: ${esc(r.other)}</div>`:""}<div class="msg m-w" role="status">Finding your pool. One moment.</div><button class="go alt" style="margin-top:12px" data-a="skip">My pool is full, continue</button>`,"STEP 6","I will keep looking.");
 if((r.status=="confirmed"&&!d.go9))return shell(`<h2>Confirmed, ${esc(r.name)}</h2><div class="msg m-ok" role="status">Your pool is full and your seat is confirmed.</div><div class="kv"><span>Route</span><b>${esc(r.pickup)} → ${esc(r.office)}</b></div><div class="kv"><span>Time</span><b>${r.reach} / ${r.leave}</b></div><div class="kv"><span>Ride</span><b>${{both:"Both ways",am:"Morning only",pm:"Evening only"}[r.ride]} · ${r.seater} seater</b></div><div class="kv"><span>This week</span><b>₹${tot}</b></div><button class="go" data-a="p9">Pick a seat</button>`,"STEP 8","You are pooled. Please proceed.");
 if(r.status=="confirmed"||r.status=="badutr")return shell(`<h2>Pick a seat</h2><div class="chips">${SEATS.map(s=>chip(s,s==(d.seat||r.seat),"seat",s)).join("")}</div><div class="lab">Pay ₹${tot} by UPI, then enter the 12 digit UTR</div><input data-f="utr" inputmode="numeric" placeholder="UTR" value="${esc(d.utr)}">${r.status=="badutr"?'<div class="msg m-b">Your UTR did not match. Please check and enter it again.</div>':""}${e}<button class="go" data-a="pay">I have paid</button><div class="msg m-w">Your seat is held for 12 to 24 hours. We will call and message you 6 hours before it ends.</div>`,"STEP 9");
 if(r.status=="checking")return shell(`<h2>Checking</h2><p>We are verifying UTR ${esc(r.utr)}.</p><div class="msg m-w" role="status">Admin is checking your payment.</div>`,"STEP 10");
 if(r.status=="verified")return shell(`<h2>Payment verified</h2><div class="msg m-ok" role="status">Your driver, vehicle and codes are being assigned.</div>`,"STEP 10");
 return shell(`<h2>All set</h2>${[["Cab",r.cab],["Driver",r.driver],["Vehicle",r.vehicle],["Seat",r.seat],["OTP",r.otp]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join("")}<div class="msg m-ok">Booked. Pooled. Unbothered.</div>`,"STEP 11");
}
/* ADMIN */
const told=r=>r.told?`<span class="pl g">● Told</span><small>${esc(r.told)}</small>`:'<span class="pl r">● Not told</span>';
const PAYM={confirmed:["n","Not paid yet"],checking:["y","● Waiting on you"],badutr:["r","● Did not match"],verified:["g","● Verified"],allset:["g","● Verified"]};
const sorted=()=>Object.keys(riders).map(k=>riders[k]).sort((a,b)=>a.ts-b.ts);
const PLACED=["confirmed","checking","badutr","verified","allset"];
function regRow(r){const w=r.status=="waitlist";
